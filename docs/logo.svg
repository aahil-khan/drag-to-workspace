<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="longShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a7a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0b3a7a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="tile">
      <rect x="64" y="64" width="896" height="880" rx="190"/>
    </clipPath>
  </defs>

  <!-- Adwaita-style base: darker lip under the tile -->
  <rect x="64" y="96" width="896" height="864" rx="190" fill="#1a5fb4"/>
  <!-- Main tile -->
  <rect x="64" y="64" width="896" height="880" rx="190" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- Long shadow cast by the window toward bottom-right -->
    <g transform="rotate(5 410 512)">
      <polygon points="590,362 1090,862 730,1152 230,652" fill="url(#longShadow)"/>
    </g>
    <!-- Long shadows for workspaces (grouped so overlaps don't stack) -->
    <g opacity="0.16" fill="#0b3a7a">
      <polygon points="890,300 1090,500 940,610 740,410"/>
      <polygon points="890,440 1090,640 940,750 740,550"/>
      <polygon points="890,580 1090,780 940,890 740,690"/>
    </g>
  </g>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="22">
    <line x1="150" y1="430" x2="210" y2="430" stroke-opacity="0.35"/>
    <line x1="112" y1="506" x2="206" y2="506" stroke-opacity="0.55"/>
    <line x1="150" y1="582" x2="200" y2="582" stroke-opacity="0.35"/>
  </g>

  <!-- Dragged window -->
  <g transform="rotate(5 410 512)">
    <!-- soft drop shadow -->
    <rect x="236" y="384" width="360" height="290" rx="34" fill="#0b2f63" fill-opacity="0.35" filter="url(#soft)"/>
    <!-- body -->
    <rect x="230" y="362" width="360" height="290" rx="34" fill="#f6f5f4"/>
    <!-- title bar -->
    <path d="M264 362 H556 A34 34 0 0 1 590 396 V430 H230 V396 A34 34 0 0 1 264 362 Z" fill="#9a9996"/>
    <circle cx="552" cy="396" r="13" fill="#f6f5f4"/>
    <!-- faint content -->
    <rect x="270" y="472" width="200" height="22" rx="11" fill="#deddda"/>
    <rect x="270" y="516" width="270" height="22" rx="11" fill="#deddda"/>
    <rect x="270" y="560" width="160" height="22" rx="11" fill="#deddda"/>
  </g>

  <!-- Workspaces -->
  <rect x="740" y="300" width="150" height="110" rx="22" fill="#99c1f1" fill-opacity="0.85"/>
  <rect x="728" y="428" width="174" height="134" rx="26" fill="#ffffff" fill-opacity="0.45" filter="url(#glow)"/>
  <rect x="740" y="440" width="150" height="110" rx="22" fill="#ffffff"/>
  <rect x="740" y="580" width="150" height="110" rx="22" fill="#99c1f1" fill-opacity="0.85"/>
</svg>
